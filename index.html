:root{
  --bg-top:#101012; --bg-bot:#0A0A0B; --ink:#FFFFFF; --soft:rgba(255,255,255,.80); --slate:#8E8E91;
  --rule:rgba(255,255,255,.12); --rule-strong:rgba(255,255,255,.35); --surf:rgba(255,255,255,.03); --sel:rgba(255,255,255,.08);
  --dark:#101012; --pad:clamp(18px,5vw,40px); --col:600px; --t:.2s ease;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--bg-bot); }
body{ min-height:100vh; min-height:100dvh; color:var(--ink); overflow-x:hidden;
      background:radial-gradient(120% 55% at 50% 0%, rgba(255,255,255,.04), rgba(255,255,255,0) 62%), linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 70%);
      background-attachment:fixed;
      font-family:"Inter Embedded","Inter","Helvetica Neue",Arial,sans-serif; font-weight:300; line-height:1.6; font-feature-settings:"kern" 1; }
.sr-only{ position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
:focus-visible{ outline:2px solid #fff; outline-offset:3px; border-radius:8px; }

/* header: wordmark left, phase badge right, satin progress hairline below */
.top{ position:sticky; top:0; z-index:5; background:var(--bg-top); padding-top:env(safe-area-inset-top); }
.top-in{ max-width:calc(var(--col) + 2*var(--pad)); margin:0 auto; padding:14px var(--pad); display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; }
.logo{ width:112px; max-width:44vw; height:auto; display:block; mix-blend-mode:lighten; margin-left:-12px; flex:none; }
.phase{ margin-left:auto; display:inline-flex; align-items:center; min-height:26px; padding:4px 12px; border:1px solid var(--rule); border-radius:999px;
        font-size:10px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--slate); line-height:1.3; text-align:center; }
.bar{ height:2px; background:rgba(255,255,255,.07); position:relative; overflow:hidden; }
.bar i{ position:absolute; left:0; top:0; bottom:0; width:0; transition:width .5s ease;
        background:linear-gradient(90deg, rgba(255,255,255,.35), rgba(255,255,255,.85)); }

/* stage */
main{ max-width:calc(var(--col) + 2*var(--pad)); margin:0 auto; padding:34px var(--pad) calc(44px + env(safe-area-inset-bottom)); touch-action:pan-y; }
.screen{ display:none; }
.screen.on{ display:block; animation:in .24s ease both; }
@keyframes in{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce){ .screen.on{ animation:none; } .bar i{ transition:none; } *{ transition:none!important; } }

.eyebrow{ font-size:12px; font-weight:200; letter-spacing:.22em; text-transform:uppercase; color:var(--slate); margin-bottom:12px; }
h1{ font-size:clamp(28px,7vw,38px); font-weight:600; line-height:1.25; letter-spacing:-.02em; margin:4px 0 20px; outline:none; }
.lead{ font-size:17px; line-height:1.6; color:var(--soft); }
.lead + .lead{ margin-top:12px; }

/* instruction cards */
ol.steps{ list-style:none; counter-reset:s; margin-top:24px; display:grid; gap:10px; }
ol.steps li{ counter-increment:s; display:grid; grid-template-columns:36px 1fr; gap:4px; padding:16px 18px; background:var(--surf);
             border:1px solid var(--rule); border-radius:12px; font-size:16.5px; line-height:1.6; color:var(--soft); }
ol.steps li::before{ content:counter(s, decimal-leading-zero); font-size:12.5px; font-weight:400; letter-spacing:.14em; color:var(--slate); padding-top:3px; }
ol.steps.single li{ grid-template-columns:1fr; } ol.steps.single li::before{ content:none; }
ul.dashes{ list-style:none; margin-top:20px; display:grid; gap:8px; }
ul.dashes li{ display:grid; grid-template-columns:24px 1fr; font-size:16.5px; color:var(--soft); }
ul.dashes li::before{ content:""; border-top:1px solid #fff; width:12px; margin-top:13px; }
.note{ margin-top:16px; padding:14px 16px; border:1px solid var(--rule); border-radius:12px; background:var(--surf); font-size:15px; color:var(--soft); }
.fine{ margin-top:16px; font-size:14px; line-height:1.6; color:var(--slate); }

/* illustration */
figure.ill{ margin:30px auto 6px; width:100%; max-width:340px; }
figure.ill svg{ display:block; width:100%; height:auto; overflow:visible; }
figure.ill figcaption{ margin-top:8px; text-align:center; font-size:12.5px; color:var(--slate); }
.hero{ margin:28px auto 0; width:clamp(120px,34vw,170px); }
.hero img{ width:100%; height:auto; display:block; }

/* questions */
fieldset{ border:0; margin-top:34px; min-width:0; }
legend, .qlabel{ display:block; font-size:19px; font-weight:600; line-height:1.4; letter-spacing:-.005em; padding:0; margin-bottom:6px; }
.hint{ display:block; font-size:14px; color:var(--slate); margin-bottom:12px; }
.tag{ font-weight:300; color:var(--slate); font-size:14px; }
.opts{ display:grid; gap:10px; margin-top:12px; }
.opt{ position:relative; display:grid; grid-template-columns:20px 1fr; align-items:center; gap:14px; min-height:56px; padding:14px 18px;
      background:var(--surf); border:1px solid var(--rule); border-radius:12px; cursor:pointer; font-size:16.5px; font-weight:400; color:var(--soft);
      transition:border-color var(--t), background-color var(--t), color var(--t); -webkit-tap-highlight-color:transparent; }
.opt input{ position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; }
.ind{ width:20px; height:20px; border:1px solid var(--rule-strong); border-radius:50%; display:grid; place-items:center; transition:background-color var(--t), border-color var(--t); }
.ind svg{ width:12px; height:12px; opacity:0; transition:opacity var(--t); }
.opt:has(input:checked){ border-color:#fff; background:var(--sel); color:#fff; }
.opt:has(input:checked) .ind{ background:#fff; border-color:#fff; }
.opt:has(input:checked) .ind svg{ opacity:1; }
.opt:has(input:focus-visible){ outline:2px solid #fff; outline-offset:3px; }
.opt:has(input:disabled){ opacity:.42; cursor:not-allowed; }
.opt > span:last-child{ min-width:0; overflow-wrap:break-word; }
.count{ margin-top:10px; font-size:14px; color:var(--slate); }
.cc{ margin-top:6px; font-size:12.5px; color:var(--slate); text-align:right; }
.cc.over{ color:#fff; font-weight:600; }

label.flabel{ display:block; font-size:15.5px; font-weight:600; margin-bottom:8px; }
input[type=text], textarea{ width:100%; font:inherit; font-size:16.5px; font-weight:300; color:#fff; background:var(--surf);
      border:1px solid var(--rule); border-radius:12px; padding:14px 16px; transition:border-color var(--t), background-color var(--t); }
textarea{ min-height:110px; resize:vertical; line-height:1.6; }
.big textarea{ min-height:140px; }
input::placeholder, textarea::placeholder{ color:rgba(255,255,255,.36); }
input[type=text]:focus, textarea:focus{ outline:none; border-color:#fff; background:var(--sel); }
.field{ margin-top:28px; }
.field.big .qlabel{ font-size:19px; }
.cond{ margin-top:14px; }
.cond[hidden]{ display:none; }

.err{ display:none; margin-top:10px; font-size:14.5px; font-weight:600; color:#fff; padding-left:24px; position:relative; }
.err::before{ content:"!"; position:absolute; left:0; top:2px; width:16px; height:16px; border:1px solid #fff; border-radius:50%;
              font-size:10px; line-height:14px; text-align:center; font-weight:700; }
.err.show{ display:block; }
.invalid .opt, .invalid input[type=text], .invalid textarea{ border-color:rgba(255,255,255,.6); }
.checkrow{ margin-top:28px; }

/* last signal */
.ls{ margin-top:42px; padding:22px 20px 20px; border:1px solid var(--rule); border-radius:12px; background:var(--surf); }
.ls h2{ font-size:12px; font-weight:700; letter-spacing:.24em; text-transform:uppercase; }
.ls p{ margin-top:10px; font-size:16px; color:var(--soft); }
.ls .field{ margin-top:16px; }

/* navigation */
.nav{ display:flex; flex-wrap:wrap; gap:12px; margin-top:40px; padding-top:22px; border-top:1px solid var(--rule); }
.btn{ font:inherit; font-size:16px; font-weight:700; letter-spacing:.01em; height:52px; min-height:52px; padding:0 22px; border-radius:999px; cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center; gap:10px; -webkit-tap-highlight-color:transparent; transition:background-color var(--t), border-color var(--t); }
.btn svg{ width:18px; height:18px; flex:none; }
.btn-next{ flex:1 1 150px; min-width:0; background:#fff; color:#101012; border:1px solid #fff; }
.btn-back{ flex:0 0 auto; background:transparent; color:#fff; border:1px solid var(--rule-strong); font-weight:600; padding:0 18px; }
.btn[disabled]{ opacity:.55; cursor:progress; }
.swipe-tip{ margin-top:14px; font-size:13px; color:var(--slate); text-align:center; }

.status{ margin-top:18px; padding:14px 16px; border:1px solid var(--rule-strong); border-radius:12px; font-size:15px; color:#fff; display:none; }
.status.show{ display:block; }
.status b{ font-weight:600; }
.spin{ display:inline-block; width:14px; height:14px; border:1.5px solid rgba(16,16,18,.3); border-top-color:#101012; border-radius:50%; animation:sp 1s linear infinite; }
@keyframes sp{ to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce){ .spin{ animation:none; } }
.preview-banner{ margin-bottom:18px; padding:10px 14px; border:1px dashed var(--rule-strong); border-radius:12px; font-size:14px; color:#fff; }
.confirm{ margin-top:24px; border:1px solid var(--rule); border-radius:12px; background:var(--surf); padding:6px 18px; }
.confirm div{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 16px; padding:12px 0; border-bottom:1px solid var(--rule); }
.confirm div:last-child{ border-bottom:0; }
.confirm dt{ font-size:12px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; color:var(--slate); }
.confirm dd{ font-size:15.5px; font-weight:500; color:#fff; overflow-wrap:anywhere; }
.confirm + .lead{ margin-top:22px; }
a.mail{ color:#fff; font-weight:600; text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; overflow-wrap:anywhere; }
.captions{ margin-top:14px; display:grid; gap:10px; }
.captions blockquote{ padding:14px 16px; border:1px solid var(--rule); border-radius:12px; background:var(--surf); font-size:15.5px; color:var(--soft); }

@media (max-width:430px){
  .logo{ width:92px; margin-left:-10px; }
  .phase{ font-size:9px; letter-spacing:.14em; padding:4px 10px; }
  .top-in{ gap:8px 10px; }
}
@media (max-width:300px){
  :root{ --pad:12px; }
  .opt{ padding:12px 12px; gap:10px; font-size:15px; }
  ol.steps li{ padding:14px 12px; grid-template-columns:30px 1fr; font-size:15.5px; }
  h1{ font-size:25px; }
  .phase{ margin-left:0; }
}
@media (min-width:760px){ main{ padding-top:54px; } .logo{ width:128px; } }
@media (orientation:landscape) and (max-height:500px){ figure.ill{ max-width:240px; } .hero{ width:110px; } main{ padding-top:22px; } }
</style>
</head>

 { id:"s05", title:"Pick it up naturally",

const STORE_KEY = "ciore-plab-draft-v1";
const state = { i:0, answers:{}, busy:false, sending:false, sent:false, submissionId:null };
function save(){ if(state.sent) return; try{ sessionStorage.setItem(STORE_KEY, JSON.stringify({i:state.i, answers:state.answers, submissionId:state.submissionId})); }catch(e){} }
function load(){ try{ const d=JSON.parse(sessionStorage.getItem(STORE_KEY)||"null"); if(d && d.answers){ state.answers=d.answers; state.i=Math.min(d.i||0, SCREENS.length-2); state.submissionId=d.submissionId||null; } }catch(e){} }
function clearDraft(){ try{ sessionStorage.removeItem(STORE_KEY); }catch(e){} }

/* ===================== pill-body diagrams =====================
   The physical V0 body is clear and carries no printed marks. Zones exist only on these diagrams.
   Front view, true proportion: 72 mm × 158 mm, 36 mm semicircular end caps. Units are millimetres,
   origin at body centre, SVG y increases downward. Side zone spans the V0 reference strip position
   (Y +1 to +23 mm); the small edge zone sits at Y +25 to +29 mm on the right edge.              */
let svgN=0;
function pill(kind){
  const id="d"+(++svgN);
  const glow=(d,w=2.4)=>`<path d="${d}" fill="none" stroke="#fff" stroke-width="${w+3.4}" stroke-linecap="round" opacity=".16" filter="url(#${id}b)"/><path d="${d}" fill="none" stroke="#fff" stroke-width="${w}" stroke-linecap="round"/>`;
  const ptr=(d,both)=>`<path d="${d}" fill="none" stroke="rgba(255,255,255,.75)" stroke-width=".8" stroke-linecap="round" marker-end="url(#${id}a)"${both?` marker-start="url(#${id}a)"`:""}/>`;
  const lead=(x1,y,x2)=>`<path d="M ${x1} ${y} L ${x2} ${y}" stroke="#fff" stroke-width=".8"/>`;
  const lbl=(x,y,lines,a="start")=>`<text x="${x}" y="${y}" fill="#fff" font-size="8" font-weight="500" text-anchor="${a}" letter-spacing=".15">${lines.map((l,k)=>`<tspan x="${x}" dy="${k?9.5:0}">${l}</tspan>`).join("")}</text>`;
  /* zone geometry */
  const crest = "M -20 -72.9 A 36 36 0 0 1 20 -72.9";          // top crest arc on the body outline
  const crestC = "M -9 -78 A 36 36 0 0 1 9 -78";               // top centre crest
  const leftE = "M -36 -23 L -36 -1", rightE = "M 36 -23 L 36 -1", smallE = "M 36 -29 L 36 -25";
  const sweep = "M -24 46 L 24 46";
  let g="", cap="", alt="";
  if(kind==="top"){ g=glow(crest)+ptr("M 17 50 C 20 14, 12 -34, 3 -68")+`<path d="M 0 -82 L 0 -90" stroke="#fff" stroke-width=".8"/>`+lead(0,-90,12)+lbl(15,-87.2,["Top Crest Zone"]);
    cap="Front view. Slide your thumb toward the top curve."; alt="Pill-shaped clear body with the top crest highlighted and an arrow from the lower thumb area toward it."; }
  if(kind==="typing"){ g=glow(sweep,2)+ptr("M -21 56 L 21 56",true)+`<path d="M 0 62 L 0 91" stroke="#fff" stroke-width=".8"/>`+lbl(0,101,["Lower Front Sweep Zone"],"middle");
    cap="Front view. Sweep your thumb across the lower front."; alt="Pill-shaped clear body with a highlighted line across the lower front and a two-headed arrow showing the side to side sweep."; }
  if(kind==="sides"){ g=glow(leftE)+glow(rightE)+ptr("M -45 -2 L -45 -22",true)+ptr("M 45 -2 L 45 -22",true)+lead(-52,-12,-62)+lbl(-65,-14.5,["Lateral","Touch Edge"],"end")+lead(52,-12,62)+lbl(65,-14.5,["Lateral","Touch Edge"]);
    cap="Front view. Slide up and down along either side edge."; alt="Pill-shaped clear body with both side edges highlighted and up and down arrows beside them."; }
  if(kind==="left"){ g=glow(leftE)+ptr("M -45 -2 L -45 -22",true)+lead(-52,-12,-62)+lbl(-65,-14.5,["Lateral","Touch Edge"],"end");
    cap="Front view, facing you. Left edge zone highlighted."; alt="Pill-shaped clear body with the left edge highlighted and an up and down arrow beside it."; }
  if(kind==="right"){ g=glow(rightE)+ptr("M 45 -2 L 45 -22",true)+lead(52,-12,62)+lbl(65,-14.5,["Lateral","Touch Edge"]);
    cap="Front view, facing you. Right edge zone highlighted."; alt="Pill-shaped clear body with the right edge highlighted and an up and down arrow beside it."; }
  if(kind==="topsensor"){ g=glow(crestC,2.6)+`<path d="M 0 -99 L 0 -84" stroke="rgba(255,255,255,.75)" stroke-width=".8" marker-end="url(#${id}a)"/>`+lead(0,-99,14)+lbl(17,-96.2,["Top Crest Zone"]);
    cap="Front view. Top curve touch zone."; alt="Pill-shaped clear body with the top center of the outline highlighted and an arrow pointing down to it."; }
  if(kind==="extra"){ g=glow(smallE,2.6)+ptr("M 70 -44 C 62 -36, 50 -30, 40.5 -27.5")+lbl(80,-62,["Upper Right","Edge Zone"],"middle");
    cap="Front view, facing you. Small upper right edge zone."; alt="Pill-shaped clear body with a short section of the upper right edge highlighted and an arrow pointing to it."; }
  if(kind==="all"){ g=glow(crest)+glow(leftE)+glow(rightE)+glow(smallE,2.6)+lead(-52,-12,-62)+lbl(-65,-14.5,["Lateral","Touch Edge"],"end")+lead(52,-12,62)+lbl(65,-14.5,["Lateral","Touch Edge"])+`<path d="M 0 -82 L 0 -90" stroke="#fff" stroke-width=".8"/>`+lead(0,-90,12)+lbl(15,-87.2,["Top Crest Zone"]);
    cap="Front view. Side and top edge zones."; alt="Pill-shaped clear body with the side edges and top crest highlighted."; }
  return `<figure class="ill"><svg viewBox="-112 -112 224 224" role="img" aria-label="${esc(alt)}" font-family="Inter Embedded, Inter, Helvetica, Arial, sans-serif">
    <defs><marker id="${id}a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
      <filter id="${id}b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter></defs>
    <rect x="-36" y="-79" width="72" height="158" rx="36" fill="rgba(255,255,255,.04)" stroke="#fff" stroke-width="1" vector-effect="non-scaling-stroke"/>
    ${g}</svg><figcaption>${esc(cap)}</figcaption></figure>`;
}

/* ===================== rendering ===================== */
function counterHTML(key, v, max){
  const n=String(v||"").length;
  return `<div class="cc${n>max?' over':''}" id="cc-${key}" data-max="${max}">${n.toLocaleString()} of ${max.toLocaleString()} characters</div>`;
}
function updateCounter(key){
  const c=document.getElementById("cc-"+key); if(!c) return;
  const max=+c.dataset.max, n=String(state.answers[key]||"").length;
  c.textContent=`${n.toLocaleString()} of ${max.toLocaleString()} characters`; c.classList.toggle("over", n>max);
}
function fieldHTML(f, sIdx){
  const v = state.answers[f.key];
  const eid = `err-${f.key}`;
  if(f.type==="radio" || f.type==="multi"){
    const multi = f.type==="multi";
    const opts = f.options.map((o,k)=>{
      const on = multi ? (Array.isArray(v) && v.includes(o)) : v===o;
      return `<label class="opt${multi?' multi':''}"><input type="${multi?'checkbox':'radio'}" name="${f.key}" value="${esc(o)}"${on?' checked':''}><span class="ind" aria-hidden="true">${CHECK}</span><span>${esc(o)}</span></label>`;
    }).join("");
    const hint = multi ? `Choose up to ${f.max === 2 ? "two" : f.max}.` : (f.req ? "Choose one." : "Choose one. Optional.");
    let cond = "";
    if(f.cond){
      const show = f.cond.on.includes(v);
      const cv = state.answers[f.cond.key] || "";
      cond = `<div class="cond" data-cond-for="${f.key}"${show?'':' hidden'}><label class="flabel" for="in-${f.cond.key}">${esc(f.cond.label)}</label>
        <textarea id="in-${f.cond.key}" name="${f.cond.key}" placeholder="${esc(f.cond.placeholder)}" rows="3" aria-describedby="cc-${f.cond.key} err-${f.cond.key}">${esc(cv)}</textarea>
        ${counterHTML(f.cond.key, cv, LIMITS.text)}<div class="err" id="err-${f.cond.key}" role="alert"></div></div>`;
    }
    return `<fieldset data-key="${f.key}" aria-describedby="${eid}"><legend>${esc(f.label)}${f.req?'':' <span class="tag">(Optional)</span>'}</legend>
      <span class="hint">${hint}</span><div class="opts">${opts}</div>${multi?`<div class="count" id="cnt-${f.key}" aria-live="polite"></div>`:''}
      <div class="err" id="${eid}" role="alert"></div>${cond}</fieldset>`;
  }
  if(f.type==="text"){
    return `<div class="field" data-key="${f.key}"><label class="flabel" for="in-${f.key}">${esc(f.label)}</label>
      <input type="text" id="in-${f.key}" name="${f.key}" value="${esc(v||"")}" placeholder="${esc(f.placeholder||"")}" autocapitalize="${f.autocap||'sentences'}" spellcheck="false" inputmode="text" aria-describedby="${eid}"${f.req?' aria-required="true"':''}>
      <div class="err" id="${eid}" role="alert"></div></div>`;
  }
  if(f.type==="textarea"){
    const q = f.question ? `<div class="qlabel" id="q-${f.key}">${esc(f.question)}${f.req?'':' <span class="tag">(Optional)</span>'}</div>` : "";
    const lbl = f.rawLabel ? esc(f.label) : (esc(f.label) + (f.req ? "" : ' <span class="tag">(Optional)</span>'));
    const cls = f.big ? "qlabel" : "flabel";
    return `<div class="field${f.big?' big':''}" data-key="${f.key}">${q}<label class="${cls}" for="in-${f.key}"${f.question?' style="font-weight:400;font-size:14.5px;color:var(--soft)"':''}>${lbl}</label>
      ${f.sub?`<span class="hint">${esc(f.sub)}</span>`:''}
      <textarea id="in-${f.key}" name="${f.key}" placeholder="${esc(f.placeholder||"")}" rows="${f.big?4:3}" aria-describedby="cc-${f.key} ${eid}"${f.req?' aria-required="true"':''}${f.question?` aria-labelledby="q-${f.key}"`:''}>${esc(v||"")}</textarea>
      ${counterHTML(f.key, v, LIMITS.text)}<div class="err" id="${eid}" role="alert"></div></div>`;
  }
  if(f.type==="check"){
    return `<div class="checkrow" data-key="${f.key}"><label class="opt multi"><input type="checkbox" name="${f.key}" value="yes"${v?' checked':''} aria-describedby="${eid}"><span class="ind" aria-hidden="true">${CHECK}</span><span>${esc(f.label)}</span></label>
      <div class="err" id="${eid}" role="alert"></div></div>`;
  }
  return "";
}

function lastSignalHTML(){
  const v = state.answers.last_signal_word || "";
  return `<section class="ls" aria-labelledby="ls-h"><h2 id="ls-h">Last Signal</h2>
    <p>Did you solve the word puzzle on your printed Last Signal card? Enter your final remaining word below.</p>
    <div class="field" style="margin-top:16px"><label class="flabel" for="in-last_signal_word">Your remaining word <span class="tag">(Optional)</span></label>
      <input type="text" id="in-last_signal_word" name="last_signal_word" value="${esc(v)}" autocapitalize="characters" spellcheck="false" aria-describedby="cc-last_signal_word err-last_signal_word">
      ${counterHTML("last_signal_word", v, LIMITS.lastSignal)}<div class="err" id="err-last_signal_word" role="alert"></div></div>
    <p class="fine">Optional: The first five correct submissions receive a guaranteed beta-testing spot.</p></section>`;
}

function completionHTML(s, idx){
  return `<section class="screen" data-idx="${idx}" aria-labelledby="h-${idx}">
    <div id="previewBanner"></div>
    <div class="eyebrow">Complete</div>
    <h1 id="h-${idx}" tabindex="-1">${esc(s.title)}</h1>
    <p class="lead">Thank you so much for your submission. We really appreciate the time that you took to do this with us. We hope you have a great day and stay safe.</p>
    <dl class="confirm" aria-label="Submission confirmation">
      <div><dt>Status</dt><dd>Received by Cioré</dd></div>
      <div><dt>Participant ID</dt><dd id="cfPid">Not available</dd></div>
      <div><dt>Confirmation code</dt><dd id="cfRef">Not available</dd></div>
      <div><dt>Received</dt><dd id="cfTime">Not available</dd></div>
    </dl>
    <p class="lead">Questions, or something not quite right with your kit? Email us at <a class="mail" href="mailto:connect@cioreofficial.com">connect@cioreofficial.com</a>.</p>
    <p class="fine">Our team will review patterns across all participants, and a Prototype Lab findings update will be shared after the study closes. You may keep your Cioré V0 form study and card.</p>
    <p class="fine">If you would like to share your unboxing or experience, you are welcome to tag <b style="font-weight:600;color:#fff">@cioreofficial</b> and use <b style="font-weight:600;color:#fff">#CiorePrototypeLab</b>.</p>
    <p class="note">Please do not share your participant ID or QR code publicly.</p>
    <div class="nav"><button type="button" class="btn btn-next" data-act="finish"><span class="lbl">${esc(s.button)}</span>${ARROW_R}</button></div>
    <p class="fine" id="finishMsg" hidden>You can close this page now.</p></section>`;
}
function fillConfirmation(pid, ref, when){
  document.getElementById("cfPid").textContent = pid || "Not available";
  document.getElementById("cfRef").textContent = ref ? String(ref).replace(/[^a-zA-Z0-9]/g,"").slice(0,8).toUpperCase() : "Not available";
  document.getElementById("cfTime").textContent = when ? when.toLocaleString([], {dateStyle:"medium", timeStyle:"short"}) : "Not available";
}

form.innerHTML = SCREENS.map(screenHTML).join("");
const screens = [...form.querySelectorAll(".screen")];

/* ===================== answers ===================== */
function fieldsOf(idx){ return SCREENS[idx].fields || []; }
function readInput(el){
  const name = el.name; if(!name) return;
  const f = allFields[name];
  if(el.type==="checkbox" && f && f.type==="multi"){
    const vals=[...form.querySelectorAll(`input[name="${name}"]:checked`)].map(x=>x.value);
    state.answers[name]=vals; updateMulti(f);
  } else if(el.type==="checkbox"){ state.answers[name]=el.checked; }
  else if(el.type==="radio"){ if(el.checked){ state.answers[name]=el.value; updateCond(f); } }
  else { state.answers[name]=el.value; updateCounter(name); }
  clearErr(name, f); save();
}
const allFields = {};
SCREENS.forEach(s=>(s.fields||[]).forEach(f=>{ allFields[f.key]=f; if(f.cond) allFields[f.cond.key]={...f.cond, type:"textarea", parent:f.key}; }));
allFields.last_signal_word = {key:"last_signal_word", type:"text", req:false};

function updateCond(f){
  if(!f || !f.cond) return;
  const box=form.querySelector(`[data-cond-for="${f.key}"]`);
  const show=f.cond.on.includes(state.answers[f.key]);
  box.hidden=!show;
  if(!show){ clearErr(f.cond.key); }
}
function updateMulti(f){
  const sel = state.answers[f.key] || [];
  form.querySelectorAll(`input[name="${f.key}"]`).forEach(i=>{ i.disabled = !i.checked && sel.length>=f.max; });
  const c=document.getElementById("cnt-"+f.key);
  if(c) c.textContent = sel.length ? `${sel.length} of ${f.max === 2 ? "two" : f.max} selected${sel.length>=f.max?". Unselect one to choose a different option.":""}` : "";
}
form.addEventListener("change", e=>readInput(e.target));
form.addEventListener("input", e=>{ if(e.target.matches("input[type=text],textarea")) readInput(e.target); });

/* ===================== validation ===================== */
function setErr(key, msg){
  const e=document.getElementById("err-"+key); if(!e) return;
  e.textContent=msg; e.classList.add("show");
  const wrap=form.querySelector(`[data-key="${key}"]`) || e.closest(".cond"); if(wrap) wrap.classList.add("invalid");
  const inp=form.querySelector(`[name="${key}"]`); if(inp && inp.type!=="radio" && inp.type!=="checkbox") inp.setAttribute("aria-invalid","true");
}
function clearErr(key){
  const e=document.getElementById("err-"+key); if(!e) return;
  e.textContent=""; e.classList.remove("show");
  const wrap=form.querySelector(`[data-key="${key}"]`) || e.closest(".cond"); if(wrap) wrap.classList.remove("invalid");
  const inp=form.querySelector(`[name="${key}"]`); if(inp) inp.removeAttribute("aria-invalid");
}
const filled = v => Array.isArray(v) ? v.length>0 : (typeof v==="boolean" ? v : !!(v && String(v).trim()));
const normPid = v => String(v||"").trim().toUpperCase();
const tooLong = (v,max) => String(v||"").trim().length > max;
const longMsg = (v,max) => `Please shorten this response to ${max.toLocaleString()} characters or fewer. It is ${String(v||"").trim().length.toLocaleString()} now.`;
function validate(idx){
  let first=null;
  for(const f of fieldsOf(idx)){
    clearErr(f.key);
    const v=state.answers[f.key];
    if(f.req && !filled(v)){
      const msg = f.missing || (f.type==="multi" ? "Please choose at least one option to continue." :
                  f.type==="radio" ? "Please choose an answer to continue." : "Please add a response to continue.");
      setErr(f.key, msg); first = first || f.key;
    } else if(f.key==="participant_id" && !LIMITS.pid.test(normPid(v))){
      setErr(f.key, "Please enter the ID exactly as printed: CPL- followed by its number, for example CPL-001."); first = first || f.key;
    } else if(f.type==="textarea" && tooLong(v, LIMITS.text)){
      setErr(f.key, longMsg(v, LIMITS.text)); first = first || f.key;
    }
    if(f.type==="multi" && Array.isArray(v) && new Set(v).size>f.max){
      setErr(f.key, "Please choose up to two options."); first = first || f.key;
    }
    if(f.cond){
      clearErr(f.cond.key);
      const active=f.cond.on.includes(v), cv=state.answers[f.cond.key];
      if(active && f.cond.req && !filled(cv)){ setErr(f.cond.key, "Please add a few words to continue."); first = first || f.cond.key; }
      else if(active && tooLong(cv, LIMITS.text)){ setErr(f.cond.key, longMsg(cv, LIMITS.text)); first = first || f.cond.key; }
    }
  }
  if(SCREENS[idx].lastSignal){
    clearErr("last_signal_word");
    if(tooLong(state.answers.last_signal_word, LIMITS.lastSignal)){
      setErr("last_signal_word", `Please keep your remaining word to ${LIMITS.lastSignal} characters or fewer.`); first = first || "last_signal_word";
    }
  }
  if(first){
    const el = form.querySelector(`[name="${first}"]`);
    const wrap = form.querySelector(`[data-key="${first}"]`) || (el && el.closest(".cond"));
    if(wrap) wrap.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
    if(el) setTimeout(()=>el.focus({preventScroll:true}), 60);
    return false;
  }
  return true;
}

/* ===================== navigation (shared by buttons and swipes) ===================== */
function show(idx, focus=true){
  state.i = idx;
  screens.forEach((s,k)=>s.classList.toggle("on", k===idx));
  const s = SCREENS[idx];
  const stepNo = s.completion ? STEP_TOTAL : idx+1;
  const ph = phaseOf(s.id);
  document.getElementById("phaseBadge").textContent = s.completion ? "Complete" : `Phase ${ph.n} · ${ph.name}`;
  document.getElementById("barFill").style.width = (s.completion ? 100 : (stepNo/STEP_TOTAL)*100) + "%";
  document.getElementById("announcer").textContent = s.completion ? s.title : `Step ${stepNo} of ${STEP_TOTAL}: ${s.title}`;
  (s.fields||[]).forEach(f=>{ if(f.type==="multi") updateMulti(f); });
  window.scrollTo({top:0, behavior:"auto"});
  if(focus){ const h=document.getElementById("h-"+idx); if(h) h.focus({preventScroll:true}); }
  save();
}
function lock(){ state.busy=true; setTimeout(()=>state.busy=false, 380); }
function goNext(){
  if(state.busy || state.sending) return false;
  const s=SCREENS[state.i];
  if(s.final || s.completion) return false;             // never submit or skip past the final page by navigation
  if(!validate(state.i)) return false;
  lock(); show(state.i+1); return true;
}
function goBack(){
  if(state.busy || state.sending || state.sent) return false;
  if(state.i<=0 || SCREENS[state.i].completion) return false;
  lock(); show(state.i-1); return true;
}
form.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="next"){ e.preventDefault(); goNext(); }
  if(a==="back"){ e.preventDefault(); goBack(); }
  if(a==="finish"){ e.preventDefault(); const m=document.getElementById("finishMsg"); m.hidden=false; m.focus && m.setAttribute("tabindex","-1"); m.focus(); }
});
form.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.matches("input[type=text]")){ e.preventDefault(); if(!SCREENS[state.i].final) goNext(); }
});

/* swipe: deliberate horizontal gestures only, never from controls, one step per gesture */
(function(){
  const stage=document.getElementById("stage");
  let sx=0, sy=0, st=0, tracking=false, horiz=null;
  const IGNORE="input,textarea,select,button,label,a,.opt,[contenteditable]";
  stage.addEventListener("touchstart", e=>{
    if(e.touches.length!==1 || e.target.closest(IGNORE)){ tracking=false; return; }
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); tracking=true; horiz=null;
  }, {passive:true});
  stage.addEventListener("touchmove", e=>{
    if(!tracking) return; const t=e.touches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
    if(horiz===null && (Math.abs(dx)>12 || Math.abs(dy)>12)) horiz = Math.abs(dx) > Math.abs(dy)*1.6;
    if(horiz===false) tracking=false;                       // vertical scroll: let it be
  }, {passive:true});
  stage.addEventListener("touchend", e=>{
    if(!tracking){ return; } tracking=false;
    const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy, dt=Date.now()-st;
    if(!horiz || Math.abs(dx)<72 || Math.abs(dy)>56 || dt>900) return;
    if(document.activeElement && document.activeElement.matches("input,textarea")) return;
    if(dx<0) goNext(); else goBack();
  }, {passive:true});
  stage.addEventListener("touchcancel", ()=>{ tracking=false; }, {passive:true});
})();

/* ===================== submission ===================== */
function buildPayload(){
  const out = { study:"Cioré Prototype Lab Cohort 1", submission_id: state.submissionId,
                client_time: new Date().toISOString(),   // informational only; the server must record its own timestamp
                participant_id: normPid(state.answers.participant_id), responses:{} };
  SCREENS.forEach(s=>(s.fields||[]).forEach(f=>{
    if(f.key==="participant_id") return;
    const v=state.answers[f.key];
    if(filled(v)) out.responses[f.key] = { question: f.question || f.label, answer: Array.isArray(v)?v:(typeof v==="string"?v.trim():v) };
    if(f.cond && f.cond.on.includes(v) && filled(state.answers[f.cond.key]))
      out.responses[f.cond.key] = { question: f.cond.label, answer: String(state.answers[f.cond.key]).trim() };
  }));
  const ls=(state.answers.last_signal_word||"").trim();
  if(ls) out.last_signal_word = ls;                        // stored as entered (trimmed); judged only by the server
  return out;
}
/* status messages are built as text nodes only, never from server HTML */
function setStatus(title, body){
  const s=document.getElementById("submitStatus"); s.textContent="";
  if(!title && !body){ s.classList.remove("show"); return; }
  if(title){ const b=document.createElement("b"); b.textContent=title; s.appendChild(b); s.appendChild(document.createTextNode(" ")); }
  if(body) s.appendChild(document.createTextNode(body));
  s.classList.add("show");
}
class SubmitError extends Error{ constructor(kind, serverMsg){ super(kind); this.kind=kind; this.serverMsg=serverMsg||""; } }
const ERR_COPY = {
  timeout:  ["We could not confirm that your feedback was received.", "The connection took too long. Your answers are still here, and trying again is safe: it uses the same reference, so nothing will be counted twice."],
  network:  ["We could not reach Cioré.", "Check your connection, then tap Try again. Your answers are still here."],
  offline:  ["You appear to be offline.", "Your answers have not been sent. Reconnect, then tap Submit my feedback again."],
  http:     ["The feedback service did not accept the request.", "Your answers are still here. Please try again in a moment."],
  html:     ["The feedback service is not available right now.", "Your answers are still here. Please try again later, or email " + SUPPORT_EMAIL + " if this keeps happening."],
  badjson:  ["We could not confirm that your feedback was received.", "The reply from the feedback service was not readable. Your answers are still here, and trying again is safe."],
  mismatch: ["We could not confirm that your feedback was received.", "The confirmation did not match this submission. Your answers are still here, and trying again is safe."],
  rejected: ["Your feedback was not saved.", ""],
  config:   ["Submission is not connected yet.", "Your answers have not been sent. They are still saved on this page, so nothing is lost."]
};
function safeServerMessage(j){
  const m = (j && typeof j.message==="string" && j.message) || (j && typeof j.error==="string" && j.error) || "";
  return m.replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim().slice(0,280);   // plain text only, short, no markup
}
function verifyReceipt(j, payload){
  if(!j || typeof j!=="object") throw new SubmitError("badjson");
  if(j.ok !== true) throw new SubmitError("rejected", safeServerMessage(j));
  if(j.submission_id !== payload.submission_id) throw new SubmitError("mismatch");
  if(normPid(j.participant_id) !== payload.participant_id) throw new SubmitError("mismatch");
  const when = new Date(j.received_at);
  if(typeof j.received_at!=="string" && typeof j.received_at!=="number" || isNaN(when.getTime())) throw new SubmitError("mismatch");
  return { when, duplicate: j.duplicate===true };
}
async function postOnce(bodyText){
  const ctrl=new AbortController(); const tm=setTimeout(()=>ctrl.abort(), SUBMIT_CONFIG.timeoutMs);
  let res;
  try{
    res = await fetch(SUBMIT_CONFIG.endpoint, { method:SUBMIT_CONFIG.method, redirect:"follow", credentials:"omit",
                      headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:bodyText, signal:ctrl.signal });
  }catch(err){
    clearTimeout(tm);
    throw new SubmitError(err && err.name==="AbortError" ? "timeout" : "network");
  }
  let text;
  try{ text = await res.text(); }catch(err){ clearTimeout(tm); throw new SubmitError(err && err.name==="AbortError" ? "timeout" : "network"); }
  clearTimeout(tm);
  const ct=(res.headers.get("content-type")||"").toLowerCase();
  const looksHtml = ct.includes("text/html") || /^\s*</.test(text);
  let j=null;
  if(!looksHtml){ try{ j=JSON.parse(text); }catch(e){ j=null; } }
  if(!res.ok){
    if(j && j.ok===false) throw new SubmitError("rejected", safeServerMessage(j));
    throw new SubmitError(looksHtml ? "html" : "http");
  }
  if(looksHtml) throw new SubmitError("html");        // e.g. a Google sign-in or error page
  if(j===null) throw new SubmitError("badjson");
  return j;
}
function lockFinal(idx, on){
  screens[idx].querySelectorAll("input,textarea,button").forEach(el=>{ el.disabled=on; });
  const btn=screens[idx].querySelector('[data-act="submit"]');
  if(on) btn.setAttribute("aria-busy","true"); else btn.removeAttribute("aria-busy");
}
form.addEventListener("submit", async e=>{
  e.preventDefault();
  if(state.sending || state.sent) return;                  // duplicate protection: one request at a time
  const idx=SCREENS.findIndex(s=>s.final);
  if(!validate(idx)) return;
  for(let k=0;k<idx;k++){ if(!validate(k)){ show(k); validate(k); return; } }   // re-check every earlier step
  // one stable ID per intended submission: reused on Try again, timeouts and page reloads (saved with the draft)
  if(!state.submissionId) state.submissionId = (crypto.randomUUID ? crypto.randomUUID() : "s-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,12));
  save();
  const lbl=form.querySelector('[data-act="submit"] .lbl');
  if(!SUBMIT_CONFIG.endpoint){ setStatus(...ERR_COPY.config); return; }
  if(navigator.onLine===false){ setStatus(...ERR_COPY.offline); return; }
  const payload = buildPayload();
  const bodyText = JSON.stringify(payload);               // the exact payload for this attempt; not rebuilt while sending
  state.sending=true; lockFinal(idx, true);
  lbl.innerHTML='<span class="spin" aria-hidden="true"></span> Sending…';
  setStatus("Sending your feedback.", "Please keep this page open. This can take up to a minute.");
  try{
    const j = await postOnce(bodyText);
    const r = verifyReceipt(j, payload);
    // confirmed by the server: only now mark as sent and clear the draft
    state.sent=true; state.sending=false;
    fillConfirmation(payload.participant_id, j.submission_id, r.when);
    clearDraft(); setStatus("", "");
    show(SCREENS.length-1);
  }catch(err){
    state.sending=false; lockFinal(idx, false);
    lbl.textContent="Try again";
    const kind = err instanceof SubmitError ? err.kind : "network";
    const [title, body] = ERR_COPY[kind] || ERR_COPY.network;
    if(kind==="rejected"){
      setStatus(title, (err.serverMsg ? err.serverMsg + " " : "") + "Your answers are still here. If you need help, email " + SUPPORT_EMAIL + ".");
    } else setStatus(title, body);
  }
});

/* design preview of the completion screen only: add #preview-complete to the URL. Nothing is sent. */
load();
if(location.hash==="#preview-complete"){
  document.getElementById("previewBanner").innerHTML='<div class="preview-banner">Design preview only. No response was sent, and the details below are sample values.</div>';
  fillConfirmation("CPL-000", "PREVIEW0", new Date());
  show(SCREENS.length-1, false);
} else {
  show(state.i, false);
  SCREENS.forEach(s=>(s.fields||[]).forEach(f=>{ if(f.cond) updateCond(f); }));
}
</script>
